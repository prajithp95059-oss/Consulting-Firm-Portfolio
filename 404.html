<script>
(function(){
  var htmlEl = document.documentElement;
  var body = document.body;
  var pre = document.getElementById('preloader');
  if(!pre) return;
  body.style.overflow = 'hidden';

  var fill = document.getElementById('preloaderFill');
  var start = Date.now();
  var MIN_MS = 450;
  var pct = 0;
  var trickle = setInterval(function(){
    pct = Math.min(88, pct + Math.random()*12);
    if(fill) fill.style.width = pct + '%';
  }, 130);

  function reveal(){
    clearInterval(trickle);
    if(fill) fill.style.width = '100%';

    try{
      var raw = sessionStorage.getItem('stackly_restore_scroll');
      if(raw){
        var data = JSON.parse(raw);
        var PATH = (window.location.pathname.split('/').pop() || 'index.html');
        if(data && data.path === PATH && !data.view){
          sessionStorage.removeItem('stackly_restore_scroll');
          if(typeof data.y === 'number'){
            var prevBehavior = htmlEl.style.scrollBehavior;
            htmlEl.style.scrollBehavior = 'auto';
            window.scrollTo(0, data.y);
            void htmlEl.offsetHeight;
            htmlEl.style.scrollBehavior = prevBehavior || '';
          }
        }
      }
    }catch(e){}

    setTimeout(function(){
      pre.classList.add('hide');
      body.style.overflow = '';
      setTimeout(function(){ pre.style.display = 'none'; }, 650);
    }, 100);
  }

  function onReady(){
    var wait = Math.max(0, MIN_MS - (Date.now() - start));
    setTimeout(reveal, wait);
  }
  if(document.readyState === 'complete'){ onReady(); }
  else{ window.addEventListener('load', onReady); }
})();
</script>

<script>
(function(){
  // ---- header scroll shadow ----
  var header = document.getElementById('siteHeader');
  if(header){
    window.addEventListener('scroll', function(){
      header.classList.toggle('scrolled', window.scrollY > 10);
    });
  }

  // ---- mobile drawer ----
  var burger = document.getElementById('hamburgerBtn');
  var drawer = document.getElementById('mobileDrawer');
  var scrim  = document.getElementById('scrim');
  var exitBtn = document.getElementById('drawerExit');

  function openDrawer(){
    drawer.classList.add('open');
    burger.classList.add('active');
    scrim.classList.add('show');
    burger.setAttribute('aria-expanded','true');
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer(){
    drawer.classList.remove('open');
    burger.classList.remove('active');
    scrim.classList.remove('show');
    burger.setAttribute('aria-expanded','false');
    document.body.style.overflow = '';
  }
  if(burger){
    burger.addEventListener('click', function(){
      drawer.classList.contains('open') ? closeDrawer() : openDrawer();
    });
    exitBtn.addEventListener('click', closeDrawer);
    scrim.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeDrawer(); });
  }

  // ---- FAQ accordion (if present) ----
  document.querySelectorAll('.faq-item').forEach(function(item){
    item.querySelector('.faq-q').addEventListener('click', function(){
      var wasOpen = item.classList.contains('open');
      document.querySelectorAll('.faq-item.open').forEach(function(o){ o.classList.remove('open'); });
      if (!wasOpen) item.classList.add('open');
    });
  });

  // ---- GSAP ----
  if (window.gsap) {
    gsap.registerPlugin(ScrollTrigger);

    // page/hero word reveal
    gsap.to('.page-hero .reveal-word span, .hero h1 .reveal-word span', {
      y: 0, duration: 0.9, ease: 'power4.out', stagger: 0.06, delay: 0.2
    });
    gsap.fromTo('.page-hero .lead, .page-hero .hero-ctas, .breadcrumb',
      { opacity: 0, y: 16 },
      { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out', stagger: 0.1, delay: 0.55 }
    );
    gsap.fromTo('.hero-copy .lead, .hero-ctas, .hero-proof',
      { opacity: 0, y: 18 },
      { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out', stagger: 0.12, delay: 0.7 }
    );
    gsap.fromTo('.hv-img, .hv-card, .hv-pin',
      { opacity: 0, scale: 0.94 },
      { opacity: 1, scale: 1, duration: 0.9, ease: 'power3.out', stagger: 0.15, delay: 0.4 }
    );

    // generic reveal-up on scroll
    gsap.utils.toArray('.reveal-up').forEach(function(el){
      gsap.to(el, {
        opacity: 1, y: 0, duration: 0.8, ease: 'power2.out',
        scrollTrigger: { trigger: el, start: 'top 88%' }
      });
    });

    // stat counters
    gsap.utils.toArray('[data-count]').forEach(function(el){
      var target = parseFloat(el.getAttribute('data-count'));
      var suffix = el.getAttribute('data-suffix') || '';
      var obj = { val: 0 };
      ScrollTrigger.create({
        trigger: el, start: 'top 90%', once: true,
        onEnter: function(){
          gsap.to(obj, {
            val: target, duration: 1.6, ease: 'power1.out',
            onUpdate: function(){ el.textContent = Math.round(obj.val) + suffix; }
          });
        }
      });
    });

  } else {
    document.querySelectorAll('.reveal-up').forEach(function(el){ el.style.opacity = 1; el.style.transform = 'none'; });
    document.querySelectorAll('.reveal-word span').forEach(function(el){ el.style.transform = 'translateY(0)'; });
  }
})();

if (window.gsap) {
  var tl = gsap.timeline({ defaults: { ease: 'power4.out' } });
  tl.to('#d1', { opacity: 1, y: 0, duration: 0.9 })
    .to('#nfCompass, #nfZero', { opacity: 1, y: 0, rotate: 0, duration: 1, ease: 'back.out(1.6)' }, '-=0.65')
    .to('#d2', { opacity: 1, y: 0, duration: 0.9 }, '-=0.75')
    .to('.nf-eyebrow', { opacity: 1, y: 0, duration: 0.6 }, '-=0.4')
    .to('.nf-title', { opacity: 1, y: 0, duration: 0.6 }, '-=0.35')
    .to('.nf-lead', { opacity: 1, y: 0, duration: 0.6 }, '-=0.35')
    .to('.nf-actions', { opacity: 1, y: 0, duration: 0.6 }, '-=0.3')
    .to('.nf-links', { opacity: 1, y: 0, duration: 0.6 }, '-=0.3');

  gsap.to('#nfCompass', { rotate: 360, duration: 8, repeat: -1, ease: 'none', delay: 1.6 });
  gsap.to('.nf-orb.o1', { y: -18, x: 10, duration: 5, repeat: -1, yoyo: true, ease: 'sine.inOut' });
  gsap.to('.nf-orb.o2', { y: 16, x: -12, duration: 6, repeat: -1, yoyo: true, ease: 'sine.inOut' });
  gsap.to('.nf-orb.o3', { y: -12, x: -8, duration: 4.5, repeat: -1, yoyo: true, ease: 'sine.inOut' });
  gsap.to('.nf-orb.o4', { y: 14, x: 8, duration: 4, repeat: -1, yoyo: true, ease: 'sine.inOut' });
} else {
  document.querySelectorAll('.nf-digit, .nf-compass, .nf-zero, .nf-eyebrow, .nf-title, .nf-lead, .nf-actions, .nf-links').forEach(function(el){
    el.style.opacity = 1; el.style.transform = 'none';
  });
}

var nfBackBtn = document.getElementById('nfBackBtn');
if (nfBackBtn) {
  nfBackBtn.addEventListener('click', function(){
    try {
      var last = sessionStorage.getItem('stackly_last_position');
      if (last) {
        var data = JSON.parse(last);
        if (data && data.path) {
          sessionStorage.setItem('stackly_restore_scroll', JSON.stringify({ path: data.path, y: data.y || 0, view: data.view }));
          window.location.href = data.path;
          return;
        }
      }
    } catch(e){}
    window.location.href = 'index.html';
  });
}

</script>
</body>
</html>
